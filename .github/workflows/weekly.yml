name: weekly-build

on:
  schedule:
    # GitHub cron is UTC. 13:37 UTC = 8:37 AM ET in standard time (Nov-Mar), 9:37 AM ET in daylight time.
    - cron: "37 13 * * 4"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to build (blank = next unplayed week)"
        required: false
      synthetic:
        description: "Use synthetic data"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.week }}" ]; then ARGS="$ARGS --week ${{ inputs.week }}"; fi
          if [ "${{ inputs.synthetic }}" = "true" ]; then ARGS="$ARGS --synthetic"; fi
          python -m pipeline.build $ARGS
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/assets 2>/dev/null || git add site/data
          git diff --cached --quiet || git commit -m "Weekly report $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
