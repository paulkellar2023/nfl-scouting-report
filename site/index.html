<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Drill Down</title>
<meta name="description" content="The Drill Down: weekly NFL matchup scouting reports and win probabilities from nflverse play-by-play data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,800;6..12,900&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B0B0C">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#/" aria-label="The Drill Down home">
    <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M11 53C11 30 30 11 53 11C53 34 34 53 11 53Z" fill="#FB4F14"/><path d="M16.5 40.5L23.5 47.5M40.5 16.5L47.5 23.5M25 39L39 25" stroke="#0B0B0C" stroke-width="3" stroke-linecap="round"/><path d="M27 33.5L30.5 37M30.5 30L34 33.5M34 26.5L37.5 30" stroke="#0B0B0C" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span class="brand-name">THE DRILL<b>DOWN</b></span>
  </a>
  <nav class="pickers">
    <label><span>Week</span><select id="week-select" aria-label="Week"></select></label>
    <label class="wide"><span>Matchup</span><select id="game-select" aria-label="Matchup"></select></label>
  </nav>
</header>
<div id="banner" class="banner" hidden></div>
<main id="app" aria-live="polite"></main>
<footer class="foot-site">
  <p>Data: <a href="https://github.com/nflverse">nflverse</a> play-by-play, participation and FTN charting via nflreadpy. Lines from nflverse schedules. Garbage time removed, opponent-adjusted where noted, shrunk toward league mean.</p>
  <p id="built"></p>
</footer>
<script src="app.js"></script>
</body>
</html>
