name: weekly-build

on:
  schedule:
    # GitHub cron is UTC. These are set for Eastern Standard Time (Nov-Mar): ET = UTC-5.
    # During daylight time (Sep-Oct) subtract 1 hour from each UTC hour to keep the same ET times.
    - cron: "3 19 * * 3"    # Wed 2:03 PM ET: early build, no email (covers Thanksgiving and other early-Thursday kickoffs)
    - cron: "3 19 * * 4"    # Thu 2:03 PM ET: weekly report + newsletter (the only run that sends email)
    - cron: "7 23 * * 4"    # Thu 6:07 PM ET: refresh about 2 hours before Thursday Night Football
    - cron: "53 15 * * 0"   # Sun 10:53 AM ET: refresh about 2 hours before the 1 PM games
    - cron: "23 19 * * 0"   # Sun 2:23 PM ET: refresh about 2 hours before the 4:05/4:25 PM games
    - cron: "17 23 * * 0"   # Sun 6:17 PM ET: refresh about 2 hours before Sunday Night Football
    - cron: "7 23 * * 1"    # Mon 6:07 PM ET: refresh about 2 hours before Monday Night Football
  workflow_dispatch:
    inputs:
      week:
        description: "Week to build (blank = next unplayed week)"
        required: false
      synthetic:
        description: "Use synthetic data"
        type: boolean
        default: false
      refresh_started:
        description: "Rebuild games that already kicked off (testing only)"
        type: boolean
        default: false
      email_test:
        description: "Test the newsletter: a draft sent only to the EMAIL_TEST_TO address (no subscribers; does not use up the week's send)"
        type: boolean
        default: false
      send_email:
        description: "Send the newsletter from this run (only if this week's has not been sent)"
        type: boolean
        default: false
      backfill_weeks:
        description: "Also backfill past weeks first, e.g. 3-9 (blank = none; week 3 is the earliest)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium  # email chart images
      - name: Build report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SEND_EMAIL: ${{ (github.event.schedule == '3 19 * * 4' || inputs.send_email) && '1' || '0' }}
          EMAIL_TEST: ${{ inputs.email_test && '1' || '0' }}
          EMAIL_TEST_TO: ${{ secrets.EMAIL_TEST_TO }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.week }}" ]; then ARGS="$ARGS --week ${{ inputs.week }}"; fi
          if [ "${{ inputs.synthetic }}" = "true" ]; then ARGS="$ARGS --synthetic"; fi
          if [ "${{ inputs.refresh_started }}" = "true" ]; then ARGS="$ARGS --refresh-started"; fi
          if [ -n "${{ inputs.backfill_weeks }}" ]; then
            FROM="${{ inputs.backfill_weeks }}"; FROM="${FROM%-*}"; TO="${{ inputs.backfill_weeks }}"; TO="${TO#*-}"
            for W in $(seq "$FROM" "$TO"); do python -m pipeline.build --week "$W" --backfill; done
          fi
          python -m pipeline.build $ARGS
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/feeds
          git add site/g site/og 2>/dev/null || true
          git add site/assets 2>/dev/null || true
          git add model 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Weekly report $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - name: Cache-bust CSS and JS
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}/g" site/*.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Health check (fails the run on errors, after the site deploys)
        run: python -m pipeline.health site/data/health.json
