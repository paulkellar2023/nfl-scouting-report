<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scouting Report</title>
<meta name="description" content="Weekly NFL matchup scouting reports built from nflverse play-by-play and FTN charting data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,800;6..12,900&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#/" aria-label="Scouting Report home">
    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand-name">SCOUTING<b>REPORT</b></span>
  </a>
  <nav class="pickers">
    <label><span>Week</span><select id="week-select" aria-label="Week"></select></label>
    <label class="wide"><span>Matchup</span><select id="game-select" aria-label="Matchup"></select></label>
  </nav>
</header>
<div id="banner" class="banner" hidden></div>
<main id="app" aria-live="polite"></main>
<footer class="foot-site">
  <p>Data: <a href="https://github.com/nflverse">nflverse</a> play-by-play, participation and FTN charting via nflreadpy. Lines from nflverse schedules. Garbage time removed, opponent-adjusted where noted, shrunk toward league mean.</p>
  <p id="built"></p>
</footer>
<script src="app.js"></script>
</body>
</html>
